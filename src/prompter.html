<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prompter Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden; background: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* Overlay container */
    #overlay {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(10, 10, 30, 0.85);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top bar: drag + info */
    #topBar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 22px;
      padding: 0 12px;
      background: rgba(255, 255, 255, 0.04);
    }
    #dragHandle {
      -webkit-app-region: drag;
      flex: 1;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
    }
    #dragHandle .grip {
      width: 32px; height: 3px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
    }
    #elapsedTime {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.35);
      font-variant-numeric: tabular-nums;
      min-width: 50px;
      text-align: right;
    }
    #pageInfo {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.3);
      min-width: 50px;
    }

    /* Content area */
    #content {
      flex: 1;
      overflow: hidden;
      padding: 10px 16px;
      position: relative;
    }
    #textContainer {
      transition: transform 0.15s ease-out;
    }

    /* Word styling */
    .word {
      display: inline;
      color: rgba(255, 255, 255, 0.45);
      transition: color 0.15s, text-shadow 0.15s;
      cursor: pointer;
      line-height: 1.5;
    }
    .word:hover { color: rgba(255, 255, 255, 0.7); }
    .word.active {
      color: #ffffff;
      text-shadow: 0 0 8px currentColor;
    }
    .word.spoken { color: rgba(255, 255, 255, 0.2); }
    .word.annotation {
      color: rgba(255, 255, 255, 0.15);
      font-style: italic;
      font-size: 0.8em;
    }

    /* Gradient masks */
    #content::before, #content::after {
      content: '';
      position: absolute; left: 0; right: 0;
      height: 16px;
      pointer-events: none;
      z-index: 10;
    }
    #content::before {
      top: 0;
      background: linear-gradient(to bottom, rgba(10,10,30,0.85), transparent);
    }
    #content::after {
      bottom: 0;
      background: linear-gradient(to top, rgba(10,10,30,0.85), transparent);
    }

    /* Bottom bar: waveform + last spoken */
    #bottomBar {
      display: flex;
      align-items: center;
      min-height: 22px;
      padding: 0 12px;
      gap: 8px;
    }

    /* Waveform */
    #waveform {
      display: flex;
      align-items: center;
      gap: 1.5px;
      height: 18px;
    }
    .wave-bar {
      width: 2.5px; height: 3px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 1px;
      transition: height 0.08s;
    }
    .wave-bar.active {
      animation: waveAnim 0.4s ease-in-out infinite alternate;
    }
    @keyframes waveAnim {
      from { height: 3px; }
      to { height: 14px; }
    }

    /* Last spoken text */
    #lastSpoken {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.25);
      flex: 1;
      text-align: right;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      direction: rtl;
    }

    /* Mic indicator */
    #micIndicator {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      transition: background 0.2s;
    }
    #micIndicator.listening {
      background: #f39c12;
      animation: micPulse 1s infinite;
    }
    @keyframes micPulse {
      0%,100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Progress bar */
    #progressBar {
      height: 2px; min-height: 2px;
      background: rgba(255, 255, 255, 0.08);
    }
    #progressFill {
      height: 100%; width: 0%;
      background: #e94560;
      transition: width 0.3s;
    }

    /* Completion screen */
    #completionScreen {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10, 10, 30, 0.95);
      z-index: 50;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #completionScreen.visible {
      display: flex;
    }
    #completionScreen .check-icon {
      font-size: 48px;
      color: #2ecc71;
      animation: checkPop 0.5s ease;
    }
    #completionScreen .done-text {
      margin-top: 8px;
      font-size: 16px;
      color: rgba(255,255,255,0.6);
    }
    @keyframes checkPop {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.3); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Page countdown overlay */
    #pageCountdown {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10, 10, 30, 0.9);
      z-index: 40;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #pageCountdown.visible { display: flex; }
    #pageCountdown .countdown-num {
      font-size: 42px;
      font-weight: bold;
      color: #e94560;
    }
    #pageCountdown .countdown-label {
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      margin-top: 4px;
    }

    /* Mirror mode */
    body.mirror #content { transform: scaleX(-1); }
    body.mirror-v #content { transform: scaleY(-1); }
    body.mirror-both #content { transform: scale(-1, -1); }
  </style>
</head>
<body>
  <div id="overlay">
    <div id="topBar">
      <span id="pageInfo"></span>
      <div id="dragHandle"><div class="grip"></div></div>
      <span id="elapsedTime">0:00</span>
    </div>

    <div id="content">
      <div id="textContainer"></div>
    </div>

    <div id="completionScreen">
      <div class="check-icon">&#10003;</div>
      <div class="done-text">Done!</div>
    </div>

    <div id="pageCountdown">
      <div class="countdown-num" id="countdownNum">3</div>
      <div class="countdown-label">Next page...</div>
    </div>

    <div id="bottomBar">
      <div id="micIndicator"></div>
      <div id="waveform"></div>
      <span id="lastSpoken"></span>
    </div>
    <div id="progressBar"><div id="progressFill"></div></div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    // ==========================================
    // STATE
    // ==========================================
    let words = [];
    let wordElements = [];
    let currentWordIndex = 0;
    let isPaused = false;
    let scrollInterval = null;
    let settings = {};
    let recognition = null;
    let isListening = false;
    let elapsedTimer = null;
    let elapsedSeconds = 0;
    let isExternal = false;

    // Elements
    const textContainer = document.getElementById('textContainer');
    const progressFill = document.getElementById('progressFill');
    const waveform = document.getElementById('waveform');
    const overlay = document.getElementById('overlay');
    const elapsedTimeEl = document.getElementById('elapsedTime');
    const lastSpokenEl = document.getElementById('lastSpoken');
    const micIndicator = document.getElementById('micIndicator');
    const pageInfoEl = document.getElementById('pageInfo');
    const completionScreen = document.getElementById('completionScreen');
    const pageCountdown = document.getElementById('pageCountdown');
    const countdownNum = document.getElementById('countdownNum');

    // Create waveform bars
    for (let i = 0; i < 16; i++) {
      const bar = document.createElement('div');
      bar.className = 'wave-bar';
      bar.style.animationDelay = (i * 0.04) + 's';
      waveform.appendChild(bar);
    }

    // ==========================================
    // ANNOTATION DETECTION
    // ==========================================
    function isAnnotation(word) {
      // Bracketed text like [pause], [beat], [slide]
      if (/^\[.*\]$/.test(word)) return true;
      // Parenthesized stage directions
      if (/^\(.*\)$/.test(word)) return true;
      // Pure emoji (basic detection)
      if (/^[\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]+$/u.test(word)) return true;
      return false;
    }

    // ==========================================
    // IPC HANDLERS
    // ==========================================

    ipcRenderer.on('update-content', (event, data) => {
      settings = data;
      isExternal = !!data.isExternal;
      initializeText(data.text);
      applyVisualSettings(data);
      startElapsedTimer();
      startMode(data.mode);

      // Page info
      if (data.totalPages > 1) {
        pageInfoEl.textContent = `${data.pageIndex + 1}/${data.totalPages}`;
      }
    });

    ipcRenderer.on('apply-settings', (event, data) => {
      const modeChanged = settings.mode !== data.mode;
      const speedChanged = settings.speed !== data.speed;
      settings = data;
      applyVisualSettings(data);

      if (modeChanged) {
        startMode(data.mode);
      } else if (speedChanged && settings.mode === 'classic') {
        // Restart classic with new speed
        if (scrollInterval) clearInterval(scrollInterval);
        startClassicMode();
      }
    });

    ipcRenderer.on('toggle-pause', () => togglePause());
    ipcRenderer.on('scroll-command', (event, cmd) => {
      if (cmd === 'toggle-pause') togglePause();
    });

    // Sync from primary (for external display)
    ipcRenderer.on('sync-progress', (event, data) => {
      if (data.currentIndex !== undefined) {
        jumpToWord(data.currentIndex);
      }
    });

    // ==========================================
    // TEXT INITIALIZATION
    // ==========================================

    function initializeText(text) {
      textContainer.innerHTML = '';
      words = text.split(/\s+/).filter(w => w.length > 0);
      wordElements = [];
      currentWordIndex = 0;
      completionScreen.classList.remove('visible');
      pageCountdown.classList.remove('visible');

      words.forEach((word, i) => {
        const span = document.createElement('span');
        span.className = 'word';
        if (isAnnotation(word)) {
          span.classList.add('annotation');
        }
        span.textContent = word + ' ';
        span.dataset.index = i;

        span.addEventListener('click', () => jumpToWord(i));
        textContainer.appendChild(span);
        wordElements.push(span);
      });

      // Reset scroll
      textContainer.style.transform = 'translateY(0)';
    }

    // ==========================================
    // VISUAL SETTINGS
    // ==========================================

    function applyVisualSettings(s) {
      textContainer.style.fontFamily = s.fontFamily;
      textContainer.style.fontSize = s.fontSize + 'px';
      progressFill.style.background = s.highlightColor;
      overlay.style.background = `rgba(10, 10, 30, ${s.opacity})`;

      // Elapsed time visibility
      elapsedTimeEl.style.display = s.showElapsed ? 'block' : 'none';

      // Mirror modes
      document.body.className = '';
      if (s.mirror) {
        document.body.classList.add('mirror');
      }

      // Update active word glow
      wordElements.forEach(el => {
        if (el.classList.contains('active')) {
          el.style.textShadow = `0 0 8px ${s.highlightColor}`;
        }
      });
    }

    // ==========================================
    // ELAPSED TIMER
    // ==========================================

    function startElapsedTimer() {
      elapsedSeconds = 0;
      if (elapsedTimer) clearInterval(elapsedTimer);
      elapsedTimer = setInterval(() => {
        if (!isPaused) {
          elapsedSeconds++;
          const min = Math.floor(elapsedSeconds / 60);
          const sec = elapsedSeconds % 60;
          elapsedTimeEl.textContent = `${min}:${sec.toString().padStart(2, '0')}`;
        }
      }, 1000);
    }

    // ==========================================
    // WORD NAVIGATION
    // ==========================================

    function jumpToWord(index) {
      if (index < 0 || index >= wordElements.length) return;

      wordElements.forEach((el, i) => {
        el.classList.remove('active');
        el.style.textShadow = 'none';
        if (i < index) {
          el.classList.add('spoken');
        } else {
          el.classList.remove('spoken');
        }
      });

      currentWordIndex = index;
      highlightWord(index);
    }

    function highlightWord(index) {
      if (index >= wordElements.length) {
        onScriptFinished();
        return;
      }

      // Skip annotations in word-tracking/voice modes
      if (isAnnotation(words[index]) && (settings.mode === 'word-tracking' || settings.mode === 'voice')) {
        currentWordIndex = index + 1;
        highlightWord(currentWordIndex);
        return;
      }

      // Mark previous as spoken
      if (index > 0 && wordElements[index - 1]) {
        wordElements[index - 1].classList.remove('active');
        wordElements[index - 1].classList.add('spoken');
        wordElements[index - 1].style.textShadow = 'none';
      }

      const el = wordElements[index];
      el.classList.add('active');
      el.classList.remove('spoken');
      el.style.textShadow = `0 0 8px ${settings.highlightColor || '#e94560'}`;

      scrollToWord(el);
      progressFill.style.width = ((index / wordElements.length) * 100) + '%';
      currentWordIndex = index;

      // Report progress to main
      ipcRenderer.send('prompter-progress', { currentIndex: index });
    }

    function scrollToWord(el) {
      const container = document.getElementById('content');
      const containerRect = container.getBoundingClientRect();
      const elRect = el.getBoundingClientRect();
      const targetY = containerRect.top + containerRect.height * 0.3;
      const diff = elRect.top - targetY;

      if (Math.abs(diff) > 5) {
        const current = parseFloat(textContainer.style.transform?.replace('translateY(', '') || '0');
        textContainer.style.transform = `translateY(${current - diff}px)`;
      }
    }

    // ==========================================
    // SCRIPT FINISHED
    // ==========================================

    function onScriptFinished() {
      stopAllModes();
      if (elapsedTimer) clearInterval(elapsedTimer);
      progressFill.style.width = '100%';

      // Show completion screen
      completionScreen.classList.add('visible');
      ipcRenderer.send('prompter-finished');

      // If auto-next-page, show countdown
      if (settings.autoNextPage && settings.pageIndex < settings.totalPages - 1) {
        completionScreen.classList.remove('visible');
        showPageCountdown(settings.autoNextDelay || 3);
      } else {
        // Auto-close after 3 seconds
        setTimeout(() => {
          window.close();
        }, 3000);
      }
    }

    function showPageCountdown(seconds) {
      pageCountdown.classList.add('visible');
      countdownNum.textContent = seconds;

      const interval = setInterval(() => {
        seconds--;
        if (seconds <= 0) {
          clearInterval(interval);
          pageCountdown.classList.remove('visible');
          // Signal control window to advance page
          ipcRenderer.send('scroll-command', 'page-finished');
        } else {
          countdownNum.textContent = seconds;
        }
      }, 1000);
    }

    // ==========================================
    // MODE: Classic Auto-Scroll
    // ==========================================

    function startClassicMode() {
      const wps = settings.speed || 3;
      const intervalMs = 1000 / wps;

      scrollInterval = setInterval(() => {
        if (!isPaused) {
          highlightWord(currentWordIndex);
          currentWordIndex++;
          if (currentWordIndex >= wordElements.length) {
            clearInterval(scrollInterval);
          }
        }
      }, intervalMs);
    }

    // ==========================================
    // MODE: Word Tracking (Speech Recognition)
    // ==========================================

    function startWordTracking() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        startClassicMode();
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = settings.speechLang || navigator.language || 'en-US';
      recognition.maxAlternatives = 3;

      let lastMatchedIndex = -1;
      let retryCount = 0;
      const MAX_RETRIES = 10;

      recognition.onresult = (event) => {
        if (isPaused) return;
        setWaveformActive(true);
        micIndicator.classList.add('listening');

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript.toLowerCase().trim();
          const spokenWords = transcript.split(/\s+/);

          // Update last spoken display
          const lastThree = spokenWords.slice(-3).join(' ');
          lastSpokenEl.textContent = lastThree;

          for (const spoken of spokenWords) {
            const cleanSpoken = normalizeWord(spoken);
            if (cleanSpoken.length < 2) continue;

            // Search forward with wider window
            const searchEnd = Math.min(lastMatchedIndex + 20, words.length);
            for (let j = Math.max(0, lastMatchedIndex + 1); j < searchEnd; j++) {
              if (isAnnotation(words[j])) continue;

              const cleanWord = normalizeWord(words[j]);
              if (fuzzyMatch(cleanSpoken, cleanWord)) {
                // Highlight all words up to match
                for (let k = currentWordIndex; k <= j; k++) {
                  highlightWord(k);
                }
                currentWordIndex = j + 1;
                lastMatchedIndex = j;
                retryCount = 0;
                break;
              }
            }
          }
        }
      };

      recognition.onspeechend = () => {
        setWaveformActive(false);
        micIndicator.classList.remove('listening');
      };

      recognition.onend = () => {
        if (isListening && !isPaused && retryCount < MAX_RETRIES) {
          retryCount++;
          try { recognition.start(); } catch (e) {}
        }
      };

      recognition.onerror = (event) => {
        if (event.error === 'not-allowed') {
          startClassicMode();
        }
      };

      try {
        recognition.start();
        isListening = true;
        micIndicator.classList.add('listening');
      } catch (e) {
        startClassicMode();
      }
    }

    // ==========================================
    // MODE: Voice-Activated Scroll
    // ==========================================

    function startVoiceScroll() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        startClassicMode();
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = settings.speechLang || navigator.language || 'en-US';

      let scrolling = false;
      let voiceScrollInterval = null;
      const wps = settings.speed || 3;
      const intervalMs = 1000 / wps;
      let retryCount = 0;

      recognition.onresult = (event) => {
        if (isPaused) return;
        setWaveformActive(true);
        micIndicator.classList.add('listening');

        // Show last spoken
        const result = event.results[event.results.length - 1];
        if (result) {
          const words = result[0].transcript.trim().split(/\s+/).slice(-3);
          lastSpokenEl.textContent = words.join(' ');
        }

        if (!scrolling) {
          scrolling = true;
          voiceScrollInterval = setInterval(() => {
            if (!isPaused && scrolling) {
              highlightWord(currentWordIndex);
              currentWordIndex++;
              if (currentWordIndex >= wordElements.length) {
                clearInterval(voiceScrollInterval);
              }
            }
          }, intervalMs);
        }
      };

      recognition.onspeechend = () => {
        scrolling = false;
        if (voiceScrollInterval) {
          clearInterval(voiceScrollInterval);
          voiceScrollInterval = null;
        }
        setWaveformActive(false);
        micIndicator.classList.remove('listening');
      };

      recognition.onend = () => {
        if (isListening && !isPaused && retryCount < 10) {
          retryCount++;
          try { recognition.start(); } catch (e) {}
        }
      };

      recognition.onerror = (event) => {
        if (event.error === 'not-allowed') {
          startClassicMode();
        }
      };

      try {
        recognition.start();
        isListening = true;
        micIndicator.classList.add('listening');
      } catch (e) {
        startClassicMode();
      }
    }

    // ==========================================
    // FUZZY MATCHING
    // ==========================================

    function normalizeWord(word) {
      return word.toLowerCase().replace(/[^a-zA-Z\u00C0-\u024F\u0400-\u04FF\u4E00-\u9FFF\u3040-\u30FF\uAC00-\uD7AF0-9]/g, '');
    }

    function fuzzyMatch(spoken, target) {
      if (!spoken || !target) return false;
      if (spoken === target) return true;
      if (target.startsWith(spoken) || spoken.startsWith(target)) return true;

      // Edit distance for short words
      if (spoken.length >= 3 && target.length >= 3) {
        const dist = editDistance(spoken, target);
        const maxLen = Math.max(spoken.length, target.length);
        if (dist / maxLen <= 0.3) return true; // 30% tolerance
      }
      return false;
    }

    function editDistance(a, b) {
      if (a.length === 0) return b.length;
      if (b.length === 0) return a.length;
      const matrix = [];
      for (let i = 0; i <= b.length; i++) matrix[i] = [i];
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          const cost = a[j - 1] === b[i - 1] ? 0 : 1;
          matrix[i][j] = Math.min(
            matrix[i - 1][j] + 1,
            matrix[i][j - 1] + 1,
            matrix[i - 1][j - 1] + cost
          );
        }
      }
      return matrix[b.length][a.length];
    }

    // ==========================================
    // MODE CONTROL
    // ==========================================

    function startMode(mode) {
      stopAllModes();
      isPaused = false;

      // Don't start speech recognition on external display
      if (isExternal) {
        return; // External gets synced via IPC
      }

      switch (mode) {
        case 'word-tracking': startWordTracking(); break;
        case 'classic': startClassicMode(); break;
        case 'voice': startVoiceScroll(); break;
        default: startClassicMode();
      }
    }

    function stopAllModes() {
      if (scrollInterval) { clearInterval(scrollInterval); scrollInterval = null; }
      if (recognition) {
        isListening = false;
        try { recognition.stop(); } catch (e) {}
        recognition = null;
      }
      setWaveformActive(false);
      micIndicator.classList.remove('listening');
    }

    function togglePause() {
      isPaused = !isPaused;
      if (isPaused) {
        if (recognition) {
          isListening = false;
          try { recognition.stop(); } catch (e) {}
        }
        setWaveformActive(false);
        micIndicator.classList.remove('listening');
      } else {
        if ((settings.mode === 'word-tracking' || settings.mode === 'voice') && recognition) {
          isListening = true;
          try { recognition.start(); } catch (e) {}
        }
      }
    }

    function setWaveformActive(active) {
      waveform.querySelectorAll('.wave-bar').forEach(bar => {
        bar.classList.toggle('active', active);
      });
    }

    // ==========================================
    // KEYBOARD SHORTCUTS
    // ==========================================

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') { e.preventDefault(); togglePause(); }
      if (e.code === 'Escape') { window.close(); }
      if (e.code === 'ArrowUp') { jumpToWord(Math.max(0, currentWordIndex - 5)); }
      if (e.code === 'ArrowDown') { jumpToWord(Math.min(wordElements.length - 1, currentWordIndex + 5)); }
      if (e.code === 'ArrowLeft') { jumpToWord(Math.max(0, currentWordIndex - 1)); }
      if (e.code === 'ArrowRight') { jumpToWord(Math.min(wordElements.length - 1, currentWordIndex + 1)); }
    });

    // Mouse scroll to jump
    document.addEventListener('wheel', (e) => {
      const delta = e.deltaY > 0 ? 3 : -3;
      jumpToWord(Math.max(0, Math.min(wordElements.length - 1, currentWordIndex + delta)));
    });
  </script>
</body>
</html>
