<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prompter Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden; background: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* Overlay container */
    #overlay {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(10, 10, 30, 0.85);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top bar: drag + info */
    #topBar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 22px;
      padding: 0 12px;
      background: rgba(255, 255, 255, 0.04);
    }
    #dragHandle {
      -webkit-app-region: drag;
      flex: 1;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
    }
    #dragHandle .grip {
      width: 32px; height: 3px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
    }
    #elapsedTime {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.35);
      font-variant-numeric: tabular-nums;
      min-width: 50px;
      text-align: right;
    }
    #elapsedTime[data-status="close"] { color: #f39c12; }
    #elapsedTime[data-status="over"] { color: #e74c3c; }
    #pageInfo {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.3);
      min-width: 50px;
    }

    /* Content area */
    #content {
      flex: 1;
      overflow: hidden;
      padding: 10px 16px;
      position: relative;
    }
    #textContainer {
      transition: transform 0.15s ease-out;
    }

    /* Word styling */
    .word {
      display: inline;
      color: rgba(255, 255, 255, 0.45);
      transition: color 0.15s, text-shadow 0.15s;
      cursor: pointer;
      line-height: 1.5;
    }
    .word:hover { color: rgba(255, 255, 255, 0.7); }
    .word.active {
      color: #ffffff;
      text-shadow: 0 0 8px currentColor;
    }
    .word.spoken { color: rgba(255, 255, 255, 0.2); }
    .word.annotation {
      color: rgba(255, 255, 255, 0.15);
      font-style: italic;
      font-size: 0.8em;
    }

    /* Gradient masks */
    #content::before, #content::after {
      content: '';
      position: absolute; left: 0; right: 0;
      height: 16px;
      pointer-events: none;
      z-index: 10;
    }
    #content::before {
      top: 0;
      background: linear-gradient(to bottom, rgba(10,10,30,0.85), transparent);
    }
    #content::after {
      bottom: 0;
      background: linear-gradient(to top, rgba(10,10,30,0.85), transparent);
    }

    /* Bottom bar: waveform + last spoken */
    #bottomBar {
      display: flex;
      align-items: center;
      min-height: 22px;
      padding: 0 12px;
      gap: 8px;
    }

    /* Waveform */
    #waveform {
      display: flex;
      align-items: center;
      gap: 1.5px;
      height: 18px;
    }
    .wave-bar {
      width: 2.5px; height: 3px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 1px;
      transition: height 0.08s;
    }
    .wave-bar.active {
      animation: waveAnim 0.4s ease-in-out infinite alternate;
    }
    @keyframes waveAnim {
      from { height: 3px; }
      to { height: 14px; }
    }

    /* Last spoken text */
    #lastSpoken {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.25);
      flex: 1;
      text-align: right;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      direction: rtl;
    }
    #lastSpoken.error {
      color: #f39c12;
      direction: ltr;
    }

    /* Mic indicator */
    #micIndicator {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      transition: background 0.2s;
    }
    #micIndicator.listening {
      background: #f39c12;
      animation: micPulse 1s infinite;
    }
    @keyframes micPulse {
      0%,100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Progress bar */
    #progressBar {
      height: 2px; min-height: 2px;
      background: rgba(255, 255, 255, 0.08);
    }
    #progressFill {
      height: 100%; width: 0%;
      background: #e94560;
      transition: width 0.3s;
    }

    /* Completion screen */
    #completionScreen {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10, 10, 30, 0.95);
      z-index: 50;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #completionScreen.visible {
      display: flex;
    }
    #completionScreen .check-icon {
      font-size: 48px;
      color: #2ecc71;
      animation: checkPop 0.5s ease;
    }
    #completionScreen .done-text {
      margin-top: 8px;
      font-size: 16px;
      color: rgba(255,255,255,0.6);
    }
    .done-detail, .countdown-detail {
      margin-top: 6px;
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      font-variant-numeric: tabular-nums;
    }
    @keyframes checkPop {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.3); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Page countdown overlay */
    #pageCountdown {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10, 10, 30, 0.9);
      z-index: 40;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #pageCountdown.visible { display: flex; }
    #pageCountdown .countdown-num {
      font-size: 42px;
      font-weight: bold;
      color: #e94560;
    }
    #pageCountdown .countdown-label {
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      margin-top: 4px;
    }

    /* Mirror mode */
    body.mirror #content { transform: scaleX(-1); }
    body.mirror-v #content { transform: scaleY(-1); }
    body.mirror-both #content { transform: scale(-1, -1); }
  </style>
</head>
<body>
  <div id="overlay">
    <div id="topBar">
      <span id="pageInfo"></span>
      <div id="dragHandle"><div class="grip"></div></div>
      <span id="elapsedTime">0:00</span>
    </div>

    <div id="content">
      <div id="textContainer"></div>
    </div>

    <div id="completionScreen">
      <div class="check-icon">&#10003;</div>
      <div class="done-text">Done!</div>
      <div class="done-detail" id="doneDetail"></div>
    </div>

    <div id="pageCountdown">
      <div class="countdown-num" id="countdownNum">3</div>
      <div class="countdown-label" id="countdownLabel">Next page...</div>
      <div class="countdown-detail" id="countdownDetail"></div>
    </div>

    <div id="bottomBar">
      <div id="micIndicator"></div>
      <div id="waveform"></div>
      <span id="lastSpoken"></span>
    </div>
    <div id="progressBar"><div id="progressFill"></div></div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const { SpeechTracker, tokenize, isAnnotation, isSpoken } = require('./speech-tracker');
    const timing = require('./timing');

    // ==========================================
    // STATE
    // ==========================================
    let words = [];
    let wordElements = [];
    let contentBefore = [];  // number of non-annotation words before each index
    let currentWordIndex = 0;
    let isPaused = false;
    let isFinished = false;
    let scrollInterval = null;
    let settings = {};
    let recognition = null;
    let isListening = false;
    let speechUnavailable = null;
    let silenceTimer = null;
    let tracker = null;
    let elapsedTimer = null;
    let countdownInterval = null;
    let closeTimer = null;
    let isExternal = false;

    // Running time in ms, excluding pauses
    let clockAccum = 0;
    let clockStart = 0;
    // A take starts with the first spoken (or scrolled) word
    let take = { number: 0, startMs: null, startWords: 0, manualNav: false };

    const SILENCE_MS = 1200;
    // Failures that won't go away by trying again in the next take
    const PERMANENT_SPEECH_ERRORS = new Set(['not supported', 'not-allowed', 'service-not-allowed']);
    let speechStartMs = null;
    const FATAL_SPEECH_ERRORS = new Set(['not-allowed', 'service-not-allowed', 'language-not-supported', 'audio-capture']);

    // Elements
    const textContainer = document.getElementById('textContainer');
    const progressFill = document.getElementById('progressFill');
    const waveform = document.getElementById('waveform');
    const overlay = document.getElementById('overlay');
    const elapsedTimeEl = document.getElementById('elapsedTime');
    const lastSpokenEl = document.getElementById('lastSpoken');
    const micIndicator = document.getElementById('micIndicator');
    const pageInfoEl = document.getElementById('pageInfo');
    const completionScreen = document.getElementById('completionScreen');
    const doneDetail = document.getElementById('doneDetail');
    const pageCountdown = document.getElementById('pageCountdown');
    const countdownNum = document.getElementById('countdownNum');
    const countdownLabel = document.getElementById('countdownLabel');
    const countdownDetail = document.getElementById('countdownDetail');

    // Create waveform bars
    for (let i = 0; i < 16; i++) {
      const bar = document.createElement('div');
      bar.className = 'wave-bar';
      bar.style.animationDelay = (i * 0.04) + 's';
      waveform.appendChild(bar);
    }

    // ==========================================
    // IPC HANDLERS
    // ==========================================

    ipcRenderer.on('update-content', (event, data) => {
      settings = data;
      isExternal = !!data.isExternal;
      applyVisualSettings(data);
      take.number = 0;
      startTake();

      // Page info
      if (data.totalPages > 1) {
        pageInfoEl.textContent = `${data.pageIndex + 1}/${data.totalPages}`;
      }
    });

    ipcRenderer.on('apply-settings', (event, data) => {
      const modeChanged = settings.mode !== data.mode;
      const speedChanged = settings.speed !== data.speed;
      // The page being recorded stays fixed; the editor may show another one
      settings = { ...data, text: settings.text, pageIndex: settings.pageIndex, totalPages: settings.totalPages };
      applyVisualSettings(data);
      if (tracker) tracker.options.jumpMinMatches = data.jumpMinMatches || 3;
      if (isFinished) return;

      if (modeChanged) {
        retrySpeech();
        startMode(data.mode);
      } else if (speedChanged && settings.mode === 'classic') {
        // Restart classic with new speed
        if (scrollInterval) clearInterval(scrollInterval);
        startClassicMode();
      }
    });

    ipcRenderer.on('toggle-pause', () => togglePause());
    ipcRenderer.on('scroll-command', (event, cmd) => {
      if (cmd === 'toggle-pause') togglePause();
      if (cmd === 'restart-take') startTake();
      if (cmd === 'take-clock-started') startTakeClock(0);
      if (cmd === 'take-finished' && isExternal) pauseClock();
      if (cmd === 'paused' && !isPaused) togglePause();
      if (cmd === 'resumed' && isPaused) togglePause();
    });

    // Sync from primary (for external display)
    ipcRenderer.on('sync-progress', (event, data) => {
      if (data.currentIndex !== undefined) {
        jumpToWord(data.currentIndex);
      }
    });

    // ==========================================
    // TEXT INITIALIZATION
    // ==========================================

    function initializeText(text) {
      textContainer.innerHTML = '';
      words = tokenize(text);
      wordElements = [];
      contentBefore = [];
      currentWordIndex = 0;
      completionScreen.classList.remove('visible');
      pageCountdown.classList.remove('visible');

      let contentWords = 0;
      words.forEach((word, i) => {
        contentBefore.push(contentWords);
        const span = document.createElement('span');
        span.className = 'word';
        if (isAnnotation(word)) span.classList.add('annotation');
        if (isSpoken(word)) contentWords++;
        span.textContent = word + ' ';
        span.dataset.index = i;

        span.addEventListener('click', () => navigateTo(i));
        textContainer.appendChild(span);
        wordElements.push(span);
      });
      contentBefore.push(contentWords);

      // Reset scroll
      textContainer.style.transform = 'translateY(0)';
      progressFill.style.width = '0%';
    }

    // ==========================================
    // VISUAL SETTINGS
    // ==========================================

    function applyVisualSettings(s) {
      textContainer.style.fontFamily = s.fontFamily;
      textContainer.style.fontSize = s.fontSize + 'px';
      progressFill.style.background = s.highlightColor;
      overlay.style.background = `rgba(10, 10, 30, ${s.opacity})`;

      // Elapsed time visibility
      elapsedTimeEl.style.display = s.showElapsed ? 'block' : 'none';

      // Mirror modes
      document.body.className = '';
      if (s.mirror) {
        document.body.classList.add('mirror');
      }

      // Update active word glow
      wordElements.forEach(el => {
        if (el.classList.contains('active')) {
          el.style.textShadow = `0 0 8px ${s.highlightColor}`;
        }
      });
    }

    // ==========================================
    // TAKES
    // ==========================================

    // (Re)starts the script from the top as a new take
    function startTake() {
      clearInterval(countdownInterval);
      clearTimeout(closeTimer);
      isFinished = false;
      take = { number: take.number + 1, startMs: null, startWords: 0, manualNav: false };
      speechStartMs = null;
      retrySpeech();
      initializeText(settings.text || '');
      startElapsedTimer();
      // Restarts and loops happen here, so the external display (and the
      // control window's pause state) restart along
      if (!isExternal && take.number > 1) ipcRenderer.send('take-started');
      startMode(settings.mode);
    }

    // Transient speech failures (network, start errors) get another chance
    function retrySpeech() {
      if (speechUnavailable && !PERMANENT_SPEECH_ERRORS.has(speechUnavailable)) {
        speechUnavailable = null;
        lastSpokenEl.classList.remove('error');
        lastSpokenEl.textContent = '';
      }
    }

    // atMs: when the take actually began (e.g. speech start before recognition)
    function startTakeClock(wordsDone, atMs) {
      if (take.startMs !== null) return;
      take.startMs = atMs !== undefined ? atMs : clockMs();
      take.startWords = wordsDone;
      // External displays start their clock together with the primary
      if (!isExternal) ipcRenderer.send('take-clock-started');
    }

    // Words before an index as timing counts them: Classic Scroll spends a
    // tick on every token, the speech modes skip annotations
    function progressCount(index) {
      return timingSettings().mode === 'classic' ? index : (contentBefore[index] || 0);
    }

    // Skipped or navigated words were not spoken, so they tell nothing about the pace
    function takeDisturbed() {
      return take.manualNav || (!!tracker && tracker.jumps > 0);
    }

    // Timing follows the mode actually running (speech may have fallen back)
    function timingSettings() {
      return speechUnavailable ? { ...settings, mode: 'classic' } : settings;
    }

    function takeSeconds() {
      return take.startMs === null ? 0 : (clockMs() - take.startMs) / 1000;
    }

    // ==========================================
    // ELAPSED TIMER
    // ==========================================

    function clockMs() {
      return clockAccum + (clockStart ? performance.now() - clockStart : 0);
    }

    function pauseClock() {
      clockAccum = clockMs();
      clockStart = 0;
    }

    function resumeClock() {
      if (!clockStart) clockStart = performance.now();
    }

    function startElapsedTimer() {
      clockAccum = 0;
      clockStart = performance.now();
      if (elapsedTimer) clearInterval(elapsedTimer);
      elapsedTimer = setInterval(renderTime, 250);
      renderTime();
    }

    // Take time and expected total length, colored against the Reel target
    function renderTime() {
      const elapsed = takeSeconds();
      let total = elapsed;
      if (!isFinished) {
        const wordsDone = progressCount(Math.min(currentWordIndex, words.length));
        const wordsLeft = progressCount(words.length) - wordsDone;
        total = take.startMs === null
          ? timing.estimateSeconds(words.join(' '), timingSettings())
          : timing.projectSeconds(elapsed, takeDisturbed() ? 0 : wordsDone - take.startWords, wordsLeft, timing.modeWpm(timingSettings()));
      }
      elapsedTimeEl.textContent = isFinished
        ? timing.formatDuration(elapsed)
        : `${timing.formatDuration(elapsed)} / ~${timing.formatDuration(total)}`;
      elapsedTimeEl.dataset.status = timing.targetStatus(total, settings.reelTarget);
    }

    // ==========================================
    // WORD NAVIGATION
    // ==========================================

    function jumpToWord(index) {
      if (index < 0 || index >= wordElements.length) return;

      wordElements.forEach((el, i) => {
        el.classList.remove('active');
        el.style.textShadow = 'none';
        if (i < index) {
          el.classList.add('spoken');
        } else {
          el.classList.remove('spoken');
        }
      });

      currentWordIndex = index;
      highlightWord(index);
    }

    // Manual navigation (click, keys, wheel): tracking continues from here
    function navigateTo(index) {
      if (isFinished || index < 0 || index >= wordElements.length) return;
      if (tracker) tracker.setCursor(index);
      take.manualNav = true;
      jumpToWord(index);
    }

    // Moves the tracking cursor, restyling only the words in between
    function moveTo(index) {
      const from = Math.min(currentWordIndex, wordElements.length);
      const lo = Math.min(from, index);
      const hi = Math.min(Math.max(from, index), wordElements.length - 1);
      for (let i = lo; i <= hi; i++) {
        const el = wordElements[i];
        el.classList.remove('active');
        el.classList.toggle('spoken', i < index);
        el.style.textShadow = 'none';
      }
      highlightWord(index);
    }

    function highlightWord(index) {
      if (isFinished) return;
      // Skip annotations in word-tracking/voice modes (loop to avoid stack overflow)
      const skipUnspoken = timingSettings().mode !== 'classic';
      while (index < wordElements.length && skipUnspoken && !isSpoken(words[index])) {
        index++;
      }
      currentWordIndex = index;

      if (index >= wordElements.length) {
        onScriptFinished();
        return;
      }

      // Mark previous as spoken
      if (index > 0 && wordElements[index - 1]) {
        wordElements[index - 1].classList.remove('active');
        wordElements[index - 1].classList.add('spoken');
        wordElements[index - 1].style.textShadow = 'none';
      }

      const el = wordElements[index];
      el.classList.add('active');
      el.classList.remove('spoken');
      el.style.textShadow = `0 0 8px ${settings.highlightColor || '#e94560'}`;

      scrollToWord(el);
      progressFill.style.width = ((index / wordElements.length) * 100) + '%';
      currentWordIndex = index;

      // Report progress to main (external displays only follow it)
      if (!isExternal) ipcRenderer.send('prompter-progress', { currentIndex: index });
    }

    function scrollToWord(el) {
      const container = document.getElementById('content');
      const containerRect = container.getBoundingClientRect();
      const elRect = el.getBoundingClientRect();
      const targetY = containerRect.top + containerRect.height * 0.3;
      const diff = elRect.top - targetY;

      if (Math.abs(diff) > 5) {
        const current = parseFloat(textContainer.style.transform?.replace('translateY(', '') || '0');
        textContainer.style.transform = `translateY(${current - diff}px)`;
      }
    }

    // ==========================================
    // SCRIPT FINISHED
    // ==========================================

    function onScriptFinished() {
      if (isFinished) return;
      isFinished = true;
      stopAllModes();
      pauseClock();
      if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; }
      progressFill.style.width = '100%';
      renderTime();

      const result = reportTake();
      const summary = takeSummary(result.seconds);

      if (settings.takeLoop) {
        // Take loop: short break, then the next take starts from the top,
        // unless the loop was switched off meanwhile
        showCountdown(settings.loopDelay || 3, 'Next take...', summary, () => {
          if (settings.takeLoop) startTake();
          else showDone(summary);
        });
      } else if (settings.autoNextPage && settings.pageIndex < settings.totalPages - 1) {
        showCountdown(settings.autoNextDelay || 3, 'Next page...', summary, () => {
          // Signal control window to advance page
          ipcRenderer.send('scroll-command', 'page-finished');
        });
      } else {
        showDone(summary);
      }
    }

    function showDone(summary) {
      if (!isExternal) ipcRenderer.send('prompter-run-ended');
      doneDetail.textContent = summary;
      completionScreen.classList.add('visible');
      // Auto-close after 3 seconds
      closeTimer = setTimeout(() => {
        window.close();
      }, 3000);
    }

    function reportTake() {
      const seconds = takeSeconds();
      const wordsSpoken = Math.max(0, progressCount(words.length) - take.startWords);
      // Only undisturbed word-tracking takes show the natural speaking pace
      const clean = settings.mode === 'word-tracking' && tracker && !takeDisturbed();
      const result = {
        take: take.number,
        seconds,
        words: wordsSpoken,
        wpm: clean ? timing.measureWpm(wordsSpoken, seconds) : null,
        mode: settings.mode,
        target: settings.reelTarget || 0,
        loop: !!settings.takeLoop,
      };
      ipcRenderer.send('prompter-finished', result);
      return result;
    }

    function takeSummary(seconds) {
      let text = `Take ${take.number} · ${timing.formatDuration(seconds)}`;
      const target = settings.reelTarget;
      if (target) {
        text += seconds <= target
          ? ` · fits ${target}s ✓`
          : ` · ${Math.ceil(seconds - target)}s over ${target}s`;
      }
      return text;
    }

    function showCountdown(seconds, label, detail, onDone) {
      countdownLabel.textContent = label;
      countdownDetail.textContent = detail;
      countdownNum.textContent = seconds;
      pageCountdown.classList.add('visible');

      clearInterval(countdownInterval);
      countdownInterval = setInterval(() => {
        if (isPaused) return;
        seconds--;
        if (seconds <= 0) {
          clearInterval(countdownInterval);
          pageCountdown.classList.remove('visible');
          onDone();
        } else {
          countdownNum.textContent = seconds;
        }
      }, 1000);
    }

    // ==========================================
    // MODE: Classic Auto-Scroll
    // ==========================================

    function startClassicMode() {
      const wps = settings.speed || 3;
      scrollInterval = setInterval(scrollTick, 1000 / wps);
    }

    // Advances one word; the tick after the last word finishes the script
    function scrollTick() {
      if (isPaused || isFinished) return;
      startTakeClock(progressCount(currentWordIndex));
      highlightWord(currentWordIndex);
      if (!isFinished) currentWordIndex++;
    }

    // ==========================================
    // MODE: Word Tracking (Speech Recognition)
    // ==========================================

    function startWordTracking() {
      tracker = new SpeechTracker(words, { jumpMinMatches: settings.jumpMinMatches || 3 });
      // Continue from the current word when switching modes mid-take
      tracker.setCursor(currentWordIndex);
      if (currentWordIndex > 0) take.manualNav = true;
      // Show where to (continue) reading
      highlightWord(currentWordIndex);
      // A page of only annotations finishes right away: no microphone needed
      if (isFinished) return;

      const started = startRecognition({
        onSession: () => { if (tracker) tracker.newSession(); },
        onResult: (event) => {
          const finals = [];
          const interim = [];
          for (let i = 0; i < event.results.length; i++) {
            const result = event.results[i];
            (result.isFinal ? finals : interim).push(...tokenize(result[0].transcript));
          }
          const heard = finals.concat(interim);
          if (heard.length) lastSpokenEl.textContent = heard.slice(-3).join(' ');

          const expected = tracker.cursor;
          let next = tracker.update(finals, interim);
          // Only finalized speech may finish the take; interim results can be revised
          const total = tracker.totalWords;
          if (total && tracker.wordsBefore(next) >= total && tracker.wordsBefore(tracker.committed.cursor) < total) {
            next = tracker.contentIndex[total - 1];
          }
          while (next < words.length && !isSpoken(words[next])) next++;
          if (next === currentWordIndex) return;
          if (next > currentWordIndex) {
            // The take began when speaking started, not when it was recognized
            const now = clockMs();
            const began = speechStartMs !== null && now - speechStartMs < 10000 ? speechStartMs : now;
            startTakeClock(tracker.wordsBefore(expected), began);
          }
          moveTo(next);
        },
      });

      if (!started) {
        tracker = null;
        startClassicMode();
      }
    }

    // ==========================================
    // MODE: Voice-Activated Scroll
    // ==========================================

    function startVoiceScroll() {
      const intervalMs = 1000 / (settings.speed || 3);

      const started = startRecognition({
        onResult: (event) => {
          // Show last spoken
          const result = event.results[event.results.length - 1];
          if (result) {
            lastSpokenEl.textContent = tokenize(result[0].transcript).slice(-3).join(' ');
          }
          if (!scrollInterval) {
            scrollTick();
            scrollInterval = setInterval(scrollTick, intervalMs);
          }
        },
        // Stop scrolling while the speaker is silent
        onSilence: () => {
          clearInterval(scrollInterval);
          scrollInterval = null;
          // The last word was reached: finish instead of waiting for more speech
          if (currentWordIndex >= words.length) scrollTick();
        },
      });

      if (!started) startClassicMode();
    }

    // ==========================================
    // SPEECH RECOGNITION
    // ==========================================

    function startRecognition({ onResult, onSession, onSilence }) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition || speechUnavailable) {
        // Callers fall back to Classic Scroll; timing follows that fallback
        speechUnavailable = speechUnavailable || 'not supported';
        showSpeechError(speechUnavailable);
        return false;
      }

      const rec = new SpeechRecognition();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = settings.speechLang || navigator.language || 'en-US';
      let failures = 0;

      // Every (re)start begins a fresh result list
      rec.onspeechstart = () => {
        if (!isPaused) speechStartMs = clockMs();
      };

      rec.onstart = () => {
        if (onSession) onSession();
      };

      rec.onresult = (event) => {
        if (isPaused || recognition !== rec) return;
        failures = 0;
        setWaveformActive(true);
        clearTimeout(silenceTimer);
        silenceTimer = setTimeout(() => {
          setWaveformActive(false);
          if (onSilence) onSilence();
        }, SILENCE_MS);
        onResult(event);
      };

      rec.onerror = (event) => {
        if (recognition !== rec || event.error === 'no-speech' || event.error === 'aborted') return;
        failures++;
        if (FATAL_SPEECH_ERRORS.has(event.error) || failures >= 3) {
          speechFailed(event.error);
        }
      };

      // Chromium ends continuous sessions after silence or a time limit
      rec.onend = () => {
        if (recognition !== rec || !isListening || isPaused) return;
        setTimeout(() => {
          if (recognition !== rec || !isListening || isPaused) return;
          try { rec.start(); } catch (e) {}
        }, failures ? 1000 : 0);
      };

      recognition = rec;
      try {
        rec.start();
        isListening = true;
        micIndicator.classList.add('listening');
        return true;
      } catch (e) {
        recognition = null;
        speechUnavailable = 'start failed';
        showSpeechError(speechUnavailable);
        return false;
      }
    }

    // No microphone access or no connection to the speech service:
    // fall back to classic scrolling and say so in the overlay
    function speechFailed(error) {
      speechUnavailable = error;
      stopAllModes();
      tracker = null;
      showSpeechError(error);
      if (!isFinished) startClassicMode();
    }

    function showSpeechError(error) {
      lastSpokenEl.textContent = `Speech recognition unavailable (${error}) – using Classic Scroll`;
      lastSpokenEl.classList.add('error');
    }

    // ==========================================
    // MODE CONTROL
    // ==========================================

    function startMode(mode) {
      stopAllModes();
      tracker = null;
      isPaused = false;
      resumeClock();

      // Don't start speech recognition on external display
      if (isExternal) {
        return; // External gets synced via IPC
      }

      switch (mode) {
        case 'word-tracking': startWordTracking(); break;
        case 'classic': startClassicMode(); break;
        case 'voice': startVoiceScroll(); break;
        default: startClassicMode();
      }
    }

    function stopAllModes() {
      if (scrollInterval) { clearInterval(scrollInterval); scrollInterval = null; }
      clearTimeout(silenceTimer);
      if (recognition) {
        isListening = false;
        const rec = recognition;
        recognition = null;
        try { rec.stop(); } catch (e) {}
      }
      setWaveformActive(false);
      micIndicator.classList.remove('listening');
    }

    function togglePause() {
      // Between takes, pausing holds the countdown
      if (isFinished) {
        if (pageCountdown.classList.contains('visible')) {
          isPaused = !isPaused;
          if (!isExternal) ipcRenderer.send('prompter-paused', isPaused);
        }
        return;
      }
      isPaused = !isPaused;
      // The external display's take clock pauses along
      if (!isExternal) ipcRenderer.send('prompter-paused', isPaused);
      if (isPaused) {
        pauseClock();
        // Voice Scroll restarts only on new speech after resuming
        if (recognition && scrollInterval) {
          clearInterval(scrollInterval);
          scrollInterval = null;
        }
        if (recognition) {
          isListening = false;
          try { recognition.stop(); } catch (e) {}
        }
        setWaveformActive(false);
        micIndicator.classList.remove('listening');
      } else {
        resumeClock();
        if (recognition) {
          isListening = true;
          micIndicator.classList.add('listening');
          try { recognition.start(); } catch (e) {}
        }
      }
    }

    function setWaveformActive(active) {
      waveform.querySelectorAll('.wave-bar').forEach(bar => {
        bar.classList.toggle('active', active);
      });
    }

    // ==========================================
    // KEYBOARD SHORTCUTS
    // ==========================================

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') { e.preventDefault(); togglePause(); }
      if (e.code === 'Escape') { window.close(); }
      if (e.code === 'KeyR' && !isExternal) { startTake(); }
      if (e.code === 'ArrowUp') { navigateTo(Math.max(0, currentWordIndex - 5)); }
      if (e.code === 'ArrowDown') { navigateTo(Math.min(wordElements.length - 1, currentWordIndex + 5)); }
      if (e.code === 'ArrowLeft') { navigateTo(Math.max(0, currentWordIndex - 1)); }
      if (e.code === 'ArrowRight') { navigateTo(Math.min(wordElements.length - 1, currentWordIndex + 1)); }
    });

    // Mouse scroll to jump
    document.addEventListener('wheel', (e) => {
      const delta = e.deltaY > 0 ? 3 : -3;
      navigateTo(Math.max(0, Math.min(wordElements.length - 1, currentWordIndex + delta)));
    });
  </script>
</body>
</html>
